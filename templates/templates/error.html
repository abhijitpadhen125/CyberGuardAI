<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        CyberGuard AI - Error
    </title>

    <style>

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #0b1120;

            color: white;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 600px;

            background: #111827;

            border: 1px solid #374151;

            border-radius: 12px;

            padding: 35px;

            text-align: center;
        }

        h1 {
            color: #ef4444;
        }

        p {
            color: #d1d5db;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        a {
            display: inline-block;

            padding: 11px 18px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

        a:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>
            ⚠ Security Error
        </h1>

        <p>
            {{ error_message }}
        </p>

        <a href="/">
            Return Home
        </a>

    </div>

</body>

</html>
